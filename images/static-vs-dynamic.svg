<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <linearGradient id="staticGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="dynamicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
  </defs>

  <rect width="1000" height="560" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />

  <!-- Section 1: Static Website Flow -->
  <g transform="translate(30, 25)">
    <!-- Header Badge -->
    <rect width="940" height="235" rx="14" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2" filter="url(#shadowBox)" />
    <rect x="20" y="16" width="180" height="32" rx="6" fill="url(#staticGrad)" />
    <text x="110" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">STATIC WEBSITE</text>
    <text x="215" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">Pre-created fixed files delivered directly from server storage</text>

    <!-- Browser Node -->
    <g transform="translate(40, 70)">
      <rect width="210" height="135" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" />
      <text x="105" y="35" font-family="sans-serif" font-size="24" text-anchor="middle">💻</text>
      <text x="105" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="middle">Visitor Browser</text>
      <text x="105" y="88" font-family="sans-serif" font-size="11" fill="#3B82F6" text-anchor="middle">Requests page (GET /index.html)</text>
      <text x="105" y="112" font-family="sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Same HTML for every visitor</text>
    </g>

    <!-- Flow Arrow 1 -->
    <path d="M 265 137 L 340 137" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrowHead)" />
    <text x="302" y="125" font-family="sans-serif" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">1. Request</text>

    <!-- Web Server Node -->
    <g transform="translate(355, 70)">
      <rect width="230" height="135" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" />
      <text x="115" y="35" font-family="sans-serif" font-size="24" text-anchor="middle">🖥️</text>
      <text x="115" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="middle">Web Server</text>
      <text x="115" y="88" font-family="sans-serif" font-size="11" fill="#3B82F6" text-anchor="middle">Apache / Nginx / CDN</text>
      <text x="115" y="112" font-family="sans-serif" font-size="11" fill="#64748B" text-anchor="middle">No DB query needed</text>
    </g>

    <!-- Flow Arrow 2 -->
    <path d="M 600 137 L 675 137" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrowHead)" />
    <text x="637" y="125" font-family="sans-serif" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">2. Fetches</text>

    <!-- File System Node -->
    <g transform="translate(690, 70)">
      <rect width="210" height="135" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" />
      <text x="105" y="35" font-family="sans-serif" font-size="24" text-anchor="middle">📄</text>
      <text x="105" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="middle">Static Files on Disk</text>
      <text x="105" y="88" font-family="sans-serif" font-size="11" fill="#3B82F6" text-anchor="middle">index.html, style.css, script.js</text>
      <text x="105" y="112" font-family="sans-serif" font-size="11" fill="#DC2626" text-anchor="middle">⚠️ Edit files to change text</text>
    </g>
  </g>

  <!-- Section 2: Dynamic Website Flow -->
  <g transform="translate(30, 285)">
    <!-- Header Badge -->
    <rect width="940" height="245" rx="14" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="2" filter="url(#shadowBox)" />
    <rect x="20" y="16" width="180" height="32" rx="6" fill="url(#dynamicGrad)" />
    <text x="110" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">DYNAMIC WEBSITE</text>
    <text x="215" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">Content generated on-the-fly based on user requests &amp; live database queries</text>

    <!-- Browser Node -->
    <g transform="translate(35, 70)">
      <rect width="185" height="145" rx="10" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.5" />
      <text x="92" y="35" font-family="sans-serif" font-size="24" text-anchor="middle">📱</text>
      <text x="92" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#581C87" text-anchor="middle">Student / Client</text>
      <text x="92" y="88" font-family="sans-serif" font-size="11" fill="#7C3AED" text-anchor="middle">Logs in / Requests page</text>
      <text x="92" y="110" font-family="sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Sends user session token</text>
      <text x="92" y="128" font-family="sans-serif" font-size="10" font-weight="600" fill="#16A34A" text-anchor="middle">Personalized View</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 230 142 L 285 142" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrowHead)" />
    <text x="257" y="130" font-family="sans-serif" font-size="10" font-weight="600" fill="#7C3AED" text-anchor="middle">1. Request</text>

    <!-- Backend / Server Node -->
    <g transform="translate(295, 70)">
      <rect width="210" height="145" rx="10" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.5" />
      <text x="105" y="35" font-family="sans-serif" font-size="24" text-anchor="middle">⚙️</text>
      <text x="105" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#581C87" text-anchor="middle">Application Server</text>
      <text x="105" y="88" font-family="sans-serif" font-size="11" fill="#7C3AED" text-anchor="middle">PHP, Node.js, Python</text>
      <text x="105" y="110" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Processes logic &amp; templates</text>
      <text x="105" y="128" font-family="sans-serif" font-size="10" font-weight="600" fill="#6B21A8" text-anchor="middle">Builds page dynamically</text>
    </g>

    <!-- Bi-directional DB Arrow -->
    <path d="M 515 130 L 585 130" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrowHead)" />
    <text x="550" y="120" font-family="sans-serif" font-size="10" font-weight="600" fill="#7C3AED" text-anchor="middle">2. SQL Query</text>
    <path d="M 585 155 L 515 155" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrowHead)" />
    <text x="550" y="172" font-family="sans-serif" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">3. Data Returned</text>

    <!-- Database Node -->
    <g transform="translate(595, 70)">
      <rect width="180" height="145" rx="10" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.5" />
      <text x="90" y="35" font-family="sans-serif" font-size="24" text-anchor="middle">🗄️</text>
      <text x="90" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#581C87" text-anchor="middle">Database</text>
      <text x="90" y="88" font-family="sans-serif" font-size="11" fill="#7C3AED" text-anchor="middle">MySQL / PostgreSQL</text>
      <text x="90" y="110" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Stores user &amp; content rows</text>
      <text x="90" y="128" font-family="sans-serif" font-size="10" font-weight="600" fill="#16A34A" text-anchor="middle">Updated via CMS dashboard</text>
    </g>

    <!-- Delivery to user badge -->
    <g transform="translate(790, 70)">
      <rect width="135" height="145" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5" />
      <text x="67" y="35" font-family="sans-serif" font-size="24" text-anchor="middle">✨</text>
      <text x="67" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#14532D" text-anchor="middle">Delivered Page</text>
      <text x="67" y="90" font-family="sans-serif" font-size="10" fill="#16A34A" text-anchor="middle">Freshly assembled</text>
      <text x="67" y="110" font-family="sans-serif" font-size="10" fill="#475569" text-anchor="middle">Tailored to user</text>
      <text x="67" y="130" font-family="sans-serif" font-size="10" font-weight="600" fill="#15803D" text-anchor="middle">4. 200 OK HTML</text>
    </g>
  </g>
</svg>

