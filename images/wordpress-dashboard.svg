<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <filter id="winShadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Browser Window Frame -->
  <g filter="url(#winShadow)">
    <rect width="960" height="540" rx="10" fill="#F0F0F1" stroke="#DCDCDE" stroke-width="1.5" />

    <!-- Browser Title Bar -->
    <rect width="960" height="38" rx="10" fill="#23282D" />
    <rect y="26" width="960" height="12" fill="#23282D" />
    <circle cx="20" cy="19" r="6" fill="#ED6A5E" />
    <circle cx="38" cy="19" r="6" fill="#F5BF4F" />
    <circle cx="56" cy="19" r="6" fill="#62C554" />
    <rect x="220" y="8" width="520" height="22" rx="4" fill="#191E23" />
    <text x="480" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#A0A5AA" text-anchor="middle">https://school-portal.edu/wp-admin/dashboard.php</text>

    <!-- Top Admin Bar -->
    <rect y="38" width="960" height="32" fill="#1D2327" />
    <circle cx="20" cy="54" r="8" fill="#2271B1" />
    <text x="20" y="58" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">W</text>
    <text x="36" y="58" font-family="sans-serif" font-size="12" font-weight="600" fill="#F0F0F1">School CMS Portal</text>
    <text x="180" y="58" font-family="sans-serif" font-size="12" fill="#A7AAAD">+ New Post</text>
    <text x="880" y="58" font-family="sans-serif" font-size="12" fill="#F0F0F1">Howdy, Administrator 👤</text>

    <!-- Left Admin Menu Sidebar -->
    <rect y="70" width="180" height="470" fill="#1D2327" />

    <!-- Menu Items -->
    <rect y="74" width="180" height="34" fill="#2271B1" />
    <text x="20" y="96" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">📊 Dashboard</text>

    <text x="20" y="132" font-family="sans-serif" font-size="13" fill="#C3C4C7">📌 Posts</text>
    <rect x="135" y="120" width="28" height="16" rx="8" fill="#2271B1" />
    <text x="149" y="132" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">24</text>

    <text x="20" y="166" font-family="sans-serif" font-size="13" fill="#C3C4C7">📁 Media</text>
    <text x="20" y="200" font-family="sans-serif" font-size="13" fill="#C3C4C7">📄 Pages</text>
    <text x="20" y="234" font-family="sans-serif" font-size="13" fill="#C3C4C7">💬 Comments</text>
    <text x="20" y="268" font-family="sans-serif" font-size="13" fill="#C3C4C7">🎨 Appearance</text>
    <text x="20" y="302" font-family="sans-serif" font-size="13" fill="#C3C4C7">🔌 Plugins</text>
    <rect x="135" y="290" width="28" height="16" rx="8" fill="#D63638" />
    <text x="149" y="302" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

    <text x="20" y="336" font-family="sans-serif" font-size="13" fill="#C3C4C7">👥 Users</text>
    <text x="20" y="370" font-family="sans-serif" font-size="13" fill="#C3C4C7">🛠️ Tools</text>
    <text x="20" y="404" font-family="sans-serif" font-size="13" fill="#C3C4C7">⚙️ Settings</text>

    <line x1="0" y1="430" x2="180" y2="430" stroke="#3C434A" stroke-width="1" />
    <text x="20" y="460" font-family="sans-serif" font-size="12" fill="#787C82">◀ Collapse menu</text>

    <!-- Main Content Area -->
    <g transform="translate(195, 80)">
      <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#1D2327">Dashboard</text>

      <!-- Welcome Banner -->
      <rect x="15" y="40" width="735" height="110" rx="4" fill="#FFFFFF" stroke="#CCD0D4" stroke-width="1" />
      <text x="35" y="70" font-family="sans-serif" font-size="18" font-weight="700" fill="#1D2327">Welcome to your School CMS Dashboard!</text>
      <text x="35" y="92" font-family="sans-serif" font-size="13" fill="#50575E">We’ve assembled some links to get you started managing school announcements and pages:</text>

      <rect x="35" y="105" width="140" height="30" rx="3" fill="#2271B1" />
      <text x="105" y="125" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Write Announcement</text>

      <rect x="190" y="105" width="120" height="30" rx="3" fill="#F6F7F7" stroke="#2271B1" stroke-width="1" />
      <text x="250" y="125" font-family="sans-serif" font-size="12" font-weight="600" fill="#2271B1" text-anchor="middle">Manage Pages</text>

      <!-- Widget 1: At a Glance -->
      <rect x="15" y="165" width="355" height="185" rx="4" fill="#FFFFFF" stroke="#CCD0D4" stroke-width="1" />
      <rect x="15" y="165" width="355" height="38" fill="#F6F7F7" stroke="#CCD0D4" stroke-width="1" />
      <text x="30" y="190" font-family="sans-serif" font-size="14" font-weight="700" fill="#1D2327">At a Glance</text>
      <text x="30" y="225" font-family="sans-serif" font-size="13" fill="#2271B1">📝 18 Published Announcements</text>
      <text x="30" y="250" font-family="sans-serif" font-size="13" fill="#2271B1">📄 12 Academic Pages</text>
      <text x="30" y="275" font-family="sans-serif" font-size="13" fill="#2271B1">💬 8 Approved Inquiries</text>
      <line x1="30" y1="295" x2="350" y2="295" stroke="#F0F0F1" stroke-width="1" />
      <text x="30" y="325" font-family="sans-serif" font-size="12" fill="#646970">WordPress 6.4 running Campus Theme</text>

      <!-- Widget 2: Quick Draft -->
      <rect x="390" y="165" width="360" height="275" rx="4" fill="#FFFFFF" stroke="#CCD0D4" stroke-width="1" />
      <rect x="390" y="165" width="360" height="38" fill="#F6F7F7" stroke="#CCD0D4" stroke-width="1" />
      <text x="405" y="190" font-family="sans-serif" font-size="14" font-weight="700" fill="#1D2327">Quick Announcement Draft</text>

      <text x="405" y="220" font-family="sans-serif" font-size="11" font-weight="600" fill="#50575E">TITLE</text>
      <rect x="405" y="228" width="330" height="28" rx="3" fill="#FFFFFF" stroke="#8C8F94" stroke-width="1" />
      <text x="415" y="247" font-family="sans-serif" font-size="12" fill="#1D2327">Enrollment Period for Second Semester</text>

      <text x="405" y="275" font-family="sans-serif" font-size="11" font-weight="600" fill="#50575E">CONTENT</text>
      <rect x="405" y="283" width="330" height="85" rx="3" fill="#FFFFFF" stroke="#8C8F94" stroke-width="1" />
      <text x="415" y="303" font-family="sans-serif" font-size="12" fill="#50575E">Students are advised to complete their enrollment requirements...</text>

      <rect x="405" y="385" width="110" height="32" rx="3" fill="#2271B1" />
      <text x="460" y="406" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Save Draft</text>

      <rect x="525" y="385" width="120" height="32" rx="3" fill="#135E96" />
      <text x="585" y="406" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Publish Now 🚀</text>

      <!-- Widget 3: Activity / Recent Posts -->
      <rect x="15" y="365" width="355" height="75" rx="4" fill="#FFFFFF" stroke="#CCD0D4" stroke-width="1" />
      <text x="30" y="390" font-family="sans-serif" font-size="13" font-weight="700" fill="#1D2327">Latest Activity</text>
      <text x="30" y="415" font-family="sans-serif" font-size="11" fill="#50575E">Published: <tspan fill="#2271B1" font-weight="600">Midterm Exam Schedule</tspan> (Yesterday at 4:15 PM)</text>
    </g>
  </g>
</svg>

